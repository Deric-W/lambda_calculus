[project]
name = "lambda_calculus"
version = "3.1.0"
description = "Implementation of the Lambda calculus"
requires-python = ">=3.10"
keywords = []
classifiers = [
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Utilities",
    "Typing :: Typed"
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[[project.authors]]
name = "Eric Niklas Wolf"
email = "eric_niklas.wolf@mailbox.tu-dresden.de"

[project.urls]
Repository = "https://github.com/Deric-W/lambda_calculus"
Documentation = "http://lambda-calculus.readthedocs.io/"
Bugtracker = "https://github.com/Deric-W/lambda_calculus/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default]
installer = "pip"

[tool.hatch.envs.hatch-test]
installer = "pip"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.hatch-check-fmt]
installer = "pip"
config-path = ".ruff_defaults.toml"

[tool.hatch.envs.hatch-check-code]
installer = "pip"
config-path = ".ruff_defaults.toml"

[tool.hatch.envs.hatch-check-types]
installer = "pip"
# do not override inherited test dependencies
extra-dependencies = [
    "mypy ~= 2.4"
]

[tool.hatch.envs.hatch-check-types.scripts]
check = "mypy -p lambda_calculus --cache-dir \"{root}/.mypy_cache\" --pretty {args}"
check-summarize = "mypy -p lambda_calculus --cache-dir \"{root}/.mypy_cache\" {args}"
coverage = "mypy -p lambda_calculus --cache-dir \"{root}/.mypy_cache\" --linecoverage-report \"{root}/.mypy_reports\" {args}"

[tool.hatch.envs.docs]
python = ">=3.12"
dependencies = [
    "sphinx ~= 9.1.0",
    "sphinx-pyproject ~= 0.3.0",
    "sphinx-rtd-theme ~= 3.1.0"
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build {args} docs docs/_build"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.pytest.ini_options]
minversion = "6.0"
python_files = "test_*.py *_test.py __init__.py"

[tool.mypy]
disallow_any_unimported = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.ruff]
extend = ".ruff_defaults.toml"
line-length = 100

[tool.ruff.lint]
ignore = [
    "TID252"    # relative imports
]

[tool.ruff.lint.extend-per-file-ignores]
"src/*" = [
    "TC001",    # sphinx autodoc does not handle typing.TYPE_CHECKING
    "TC003"     # sphinx autodoc does not handle typing.TYPE_CHECKING
]
"tests/*" = [
    "PT009",    # unittest-style assert
    "PT027"     # unittest-style assertRaises
]
"docs/*" = [
    "INP001"    # implicit namespace package
]

[tool.coverage.run]
source_pkgs = ["lambda_calculus"]
branch = true
parallel = true

[tool.sphinx-pyproject]
project = "lambda_calculus"
copyright = "2022 Eric Wolf"
html_theme = "sphinx_rtd_theme"
extensions = [
    "sphinx.ext.intersphinx",
    "sphinx.ext.autodoc",
    "sphinx.ext.viewcode"
]
autodoc_typehints_format = "short"
autodoc_warningiserror = true

[tool.sphinx-pyproject.autodoc_default_options]
show-inheritance = true
member-order = "bysource"
ignore-module-all = true