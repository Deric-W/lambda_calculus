name: Test

on: [push, workflow_dispatch]

jobs:
  test:
    name: Run tests and checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: |
          3.10
          3.11
          3.12
          3.13
          3.14
        cache: pip

    - name: Install Hatch
      run: python -m pip install "hatch ~= 1.17.0"

    - name: Perform code checks
      run: hatch check code --sync

    - name: Perform formatting checks
      run: hatch check fmt --sync

    - name: Perform type checks
      run: hatch check types

    - name: Run tests and generate coverage report
      run: hatch test --all --cover-quiet --cover-xml --verbose

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        flags: ${{ runner.os }}
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
