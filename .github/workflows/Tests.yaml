name: Tests

on: [push, workflow_dispatch]

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: |
          3.10
          3.11
          3.12
          3.13
          3.14
        cache: pip

    - name: Install Hatch
      run: python -m pip install "hatch ~= 1.17.0"

    - name: Perform code checks
      run: hatch check code --sync

    - name: Perform formatting checks
      run: hatch check fmt --sync

    - name: Perform type checks
      run: hatch check types

    - name: Run tests
      run: hatch test --all --cover-quiet --verbose

    - name: Generate report
      run: hatch env run -e hatch-test.py3.13 coverage xml

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        flags: ${{ runner.os }}
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Build wheel
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      run: hatch build

    - name: Publish package
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true
        skip_existing: true